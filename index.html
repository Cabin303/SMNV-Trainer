<style>
:root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #111827;
    --muted: #667085;
    --line: #d7dde6;
    --primary: #176b87;
    --primary-hover: #12576e;
    --ink: #1f2937;
    --red: #dc2626;
    --green: #16a34a;
    --shadow: 0 16px 34px rgba(15, 23, 42, 0.12);
}

[data-theme="dark"] {
    --bg: #111418;
    --panel: #1b2028;
    --text: #edf2f7;
    --muted: #a2adbd;
    --line: #303846;
    --primary: #2aa8c8;
    --primary-hover: #46b8d3;
    --ink: #e5e7eb;
    --red: #f87171;
    --green: #4ade80;
    --shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.app {
    width: min(980px, 100%);
    margin: 0 auto;
    padding: 18px;
}


.toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.compact-toolbar {
    justify-content: flex-end;
    margin: 0 0 12px;
}

.small-btn,
.icon-btn {
    min-height: 42px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
}

.small-btn {
    padding: 0 12px;
    font-weight: 700;
}

.icon-btn {
    width: 42px;
    display: grid;
    place-items: center;
    font-size: 18px;
}

.layout {
    display: block;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 8px 0 14px;
}

.segmented {
    display: flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 8px;
}

.segmented button {
    min-height: 36px;
    border-radius: 6px;
    padding: 0 12px;
    background: transparent;
    color: var(--muted);
    font-weight: 750;
}

.segmented button.active {
    background: var(--primary);
    color: #ffffff;
}

.status-line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 10px;
}

.section-picker {
    position: relative;
    margin-bottom: 12px;
}

.section-toggle {
    width: 100%;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-weight: 800;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
}

.section-toggle-arrow {
    color: var(--muted);
    transition: transform 0.18s ease;
}

.section-toggle[aria-expanded="true"] .section-toggle-arrow {
    transform: rotate(180deg);
}

.section-nav {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    z-index: 25;
    display: grid;
    gap: 8px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: var(--shadow);
}

.section-nav[hidden] {
    display: none;
}

.section-btn {
    min-height: 40px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-weight: 750;
    text-align: left;
}

.section-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--panel);
}

.card-nav {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
    gap: 8px;
    margin-bottom: 14px;
}

.nav-btn {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-weight: 850;
}

.nav-btn.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--panel);
}

.nav-btn::after {
    content: "";
    position: absolute;
    right: 5px;
    bottom: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: transparent;
}

.nav-btn.mark-red::after {
    background: var(--red);
}

.nav-btn.mark-green::after {
    background: var(--green);
}

.flashcard {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: clamp(22px, 4vw, 42px);
}

.category {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    margin-bottom: 22px;
}

.term {
    min-height: 116px;
    display: flex;
    align-items: center;
    font-weight: 800;
    font-size: clamp(18px, 2.8vw, 30px);
    line-height: 1.35;
    letter-spacing: 0;
    word-break: break-word;
}

.typing {
    display: none;
    margin-top: 18px;
}

.typing.active {
    display: block;
}

.typing label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
}

.typing input {
    width: 100%;
    min-height: 52px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    padding: 0 14px;
    outline: none;
}

.typing input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
}

.typing-result {
    min-height: 22px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
}

.answer {
    display: none;
    margin-top: 26px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
}

.answer.visible {
    display: block;
}

.answer-main {
    font-size: clamp(17px, 2.5vw, 26px);
    line-height: 1.4;
    font-weight: 700;
    color: var(--primary);
    word-break: break-word;
}

.answer-extra {
    margin-top: 14px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.5;
}

.actions {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 10px;
    margin-top: 14px;
}

.action-btn {
    min-height: 54px;
    border-radius: 8px;
    padding: 10px 14px;
    background: var(--ink);
    color: var(--panel);
    font-weight: 850;
}

.primary {
    background: var(--primary);
    color: #ffffff;
}

.primary:hover {
    background: var(--primary-hover);
}

.marks {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.marks button {
    min-height: 58px;
    border-radius: 8px;
    padding: 10px 12px;
    color: #ffffff;
    font-weight: 850;
}

.red-btn {
    background: var(--red);
}

.green-btn {
    background: var(--green);
}

@media (max-width: 640px) {
    .app {
        padding: 10px;
    }
    .toolbar {
        justify-content: flex-end;
    }

    .controls,
    .actions,
    .marks {
        grid-template-columns: 1fr;
        display: grid;
    }

    .segmented {
        overflow-x: auto;
    }

    .segmented button {
        flex: 1 0 auto;
    }

    .term {
        min-height: 96px;
    }
}
</style>

let marks = loadMarks();
let current = 0;
let answerVisible = false;
let direction = "normal";
let studyType = "cards";

const els = {
    html: document.documentElement,
    cardNav: document.getElementById("cardNav"),
    sectionNav: document.getElementById("sectionNav"),
    sectionToggle: document.getElementById("sectionToggle"),
    sectionCurrent: document.getElementById("sectionCurrent"),
    category: document.getElementById("category"),
    directionText: document.getElementById("directionText"),
    frontText: document.getElementById("frontText"),
    backText: document.getElementById("backText"),
    noteText: document.getElementById("noteText"),
    answerBox: document.getElementById("answerBox"),
    showBtn: document.getElementById("showBtn"),
    nextBtn: document.getElementById("nextBtn"),
    positionText: document.getElementById("positionText"),
    markText: document.getElementById("markText"),
    modeNormal: document.getElementById("modeNormal"),
    modeReverse: document.getElementById("modeReverse"),
    studyCards: document.getElementById("studyCards"),
    studyTyping: document.getElementById("studyTyping"),
    typingBox: document.getElementById("typingBox"),
    typedAnswer: document.getElementById("typedAnswer"),
    typingResult: document.getElementById("typingResult"),
    resetMarks: document.getElementById("resetMarks"),
    themeToggle: document.getElementById("themeToggle")
};

const sections = buildSections(cards);
let currentSection = 0;
let sectionMenuOpen = false;

function buildSections(cards) {
    const map = new Map();

    cards.forEach((card, index) => {
        const category = getCardCategory(card);
        if (!map.has(category)) {
            map.set(category, {
                title: category,
                indices: []
            });
        }
        map.get(category).indices.push(index);
    });

    return Array.from(map.values());
}

function getSectionByCardIndex(cardIndex) {
    return sections.findIndex(section => section.indices.includes(cardIndex));
}

function getCurrentSection() {
    return sections[currentSection];
}

function openSectionMenu() {
    sectionMenuOpen = true;
    els.sectionNav.hidden = false;
    els.sectionToggle.setAttribute("aria-expanded", "true");
}

function closeSectionMenu() {
    sectionMenuOpen = false;
    els.sectionNav.hidden = true;
    els.sectionToggle.setAttribute("aria-expanded", "false");
}

function toggleSectionMenu() {
    if (sectionMenuOpen) {
        closeSectionMenu();
    } else {
        openSectionMenu();
    }
}



function emptyMarks() {
    return cards.map(() => "none");
}

function loadMarks() {
    try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(parsed)) {
            return cards.map((_, index) => {
                const mark = parsed[index];
                return ["red", "green", "none"].includes(mark) ? mark : "none";
            });
        }
    } catch (error) {
    }

    return emptyMarks();
}

function saveMarks() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(marks));
    } catch (error) {
    }
}

function getCardEnglish(card) {
    return Array.isArray(card) ? card[0] : card.eng;
}

function getCardRussian(card) {
    return Array.isArray(card) ? card[1] : card.ru;
}

function getCardCategory(card) {
    return Array.isArray(card) ? "Minimum for Review" : (card.category || "Minimum for Review");
}

function getFrontBack(card) {
    const activeDirection = direction;
    const english = getCardEnglish(card);
    const russian = getCardRussian(card);
    return activeDirection === "reverse"
        ? { front: russian, back: english, label: "RU → EN", prompt: "английский" }
        : { front: english, back: russian, label: "EN → RU", prompt: "перевод" };
}

function markLabel(mark) {
    if (mark === "red") return "Не знаю";
    if (mark === "green") return "Знаю";
    return "Без метки";
}

function render() {
    const card = cards[current];
    const pair = getFrontBack(card);

    els.category.textContent = getCardCategory(card);
    els.directionText.textContent = pair.label;
    els.frontText.textContent = pair.front;
    els.backText.textContent = pair.back;
    els.noteText.textContent = card.note || "";
    els.answerBox.classList.toggle("visible", answerVisible);
    els.showBtn.textContent = answerVisible ? "Скрыть ответ" : `Показать ${pair.prompt}`;
    els.positionText.textContent = `${current + 1} / ${cards.length}`;
    els.markText.textContent = markLabel(marks[current]);

    const currentSectionData = getCurrentSection();
    els.sectionCurrent.textContent = currentSectionData
        ? currentSectionData.title
        : "Раздел";

    els.typingBox.classList.toggle("active", studyType === "typing");
    els.typedAnswer.placeholder = pair.prompt === "перевод" ? "Введите русский перевод" : "Введите английскую фразу";

    if (!answerVisible) {
        els.typingResult.textContent = "";
    }

    const section = getCurrentSection();
    const sectionIndices = section ? section.indices : [];

    document.querySelectorAll(".nav-btn").forEach((button, localIndex) => {
        const cardIndex = sectionIndices[localIndex];
        const isActive = cardIndex === current;
        button.classList.toggle("active", isActive);
        button.classList.toggle("mark-red", marks[cardIndex] === "red");
        button.classList.toggle("mark-green", marks[cardIndex] === "green");
        button.setAttribute("aria-current", isActive ? "true" : "false");
    });

    saveMarks();
}

function renderSections() {
    els.sectionNav.innerHTML = "";

    sections.forEach((section, index) => {
        const button = document.createElement("button");
        button.className = "section-btn";
        button.type = "button";
        button.textContent = section.title;
        button.classList.toggle("active", index === currentSection);
        button.addEventListener("click", () => goToSection(index));
        els.sectionNav.appendChild(button);
    });
}

function renderNavigation() {
    els.cardNav.innerHTML = "";

    const section = getCurrentSection();
    if (!section) return;

    section.indices.forEach((cardIndex, localIndex) => {
        const card = cards[cardIndex];
        const button = document.createElement("button");
        button.className = "nav-btn";
        button.type = "button";

        const pairNumber = Math.floor(localIndex / 2) + 1;
        const isQuestion = localIndex % 2 === 0;

        button.textContent = `${isQuestion ? "Q" : "A"}${pairNumber}`;
        button.setAttribute(
            "aria-label",
            `${card.category} ${isQuestion ? "Question" : "Answer"}: ${getCardEnglish(card)}`
        );
        button.addEventListener("click", () => goTo(cardIndex));
        els.cardNav.appendChild(button);
    });
}

function goToSection(sectionIndex) {
    currentSection = sectionIndex;
    closeSectionMenu();
    const section = getCurrentSection();
    if (!section || !section.indices.length) return;
    goTo(section.indices[0]);
}

function goTo(index) {
    current = (index + cards.length) % cards.length;
    answerVisible = false;
    els.typedAnswer.value = "";

    const sectionIndex = getSectionByCardIndex(current);
    if (sectionIndex !== -1) {
        currentSection = sectionIndex;
    }

    renderSections();
    renderNavigation();
    render();
}

function move(step) {
    const section = getCurrentSection();
    if (!section || !section.indices.length) return;

    const position = section.indices.indexOf(current);
    const nextPosition = position === -1
        ? 0
        : (position + step + section.indices.length) % section.indices.length;

    goTo(section.indices[nextPosition]);
}

function showAnswer() {
    answerVisible = !answerVisible;
    if (answerVisible && studyType === "typing") {
        checkTypedAnswer();
    }
    render();
}

function normalizeAnswer(value) {
    return value
        .toLowerCase()
        .replace(/[.,!?;:()[\]"']/g, "")
        .replace(/\s+/g, " ")
        .trim();
}

function similarity(a, b) {
    const left = normalizeAnswer(a);
    const right = normalizeAnswer(b);
    if (!left || !right) return 0;
    if (left === right) return 1;

    const leftWords = new Set(left.split(" "));
    const rightWords = new Set(right.split(" "));
    const common = [...leftWords].filter(word => rightWords.has(word)).length;
    return common / Math.max(leftWords.size, rightWords.size);
}

function checkTypedAnswer() {
    const expected = getFrontBack(cards[current]).back;
    const value = els.typedAnswer.value;
    const score = similarity(value, expected);

    if (!value.trim()) {
        els.typingResult.textContent = "";
    } else if (score > 0.82) {
        els.typingResult.textContent = "Очень близко.";
    } else if (score > 0.45) {
        els.typingResult.textContent = "Частично совпадает, проверьте ключевые слова.";
    } else {
        els.typingResult.textContent = "Пока далеко от ответа.";
    }
}

function setDirection(next) {
    direction = next;
    answerVisible = false;
    els.modeNormal.classList.toggle("active", next === "normal");
    els.modeReverse.classList.toggle("active", next === "reverse");
    render();
}

function setStudyType(next) {
    studyType = next;
    answerVisible = false;
    els.studyCards.classList.toggle("active", next === "cards");
    els.studyTyping.classList.toggle("active", next === "typing");
    els.typedAnswer.value = "";
    render();
}

function setMark(mark) {
    marks[current] = mark;
    saveMarks();
    render();
    move(1);
}

function resetMarks() {
    const confirmed = confirm("Сбросить все цветные метки?");
    if (!confirmed) return;

    marks = emptyMarks();
    saveMarks();
    render();
}

function initTheme() {
    let savedTheme = null;
    try {
        savedTheme = localStorage.getItem(THEME_KEY);
    } catch (error) {
    }

    const media = window.matchMedia("(prefers-color-scheme: dark)");
    els.html.setAttribute("data-theme", savedTheme || (media.matches ? "dark" : "light"));

    els.themeToggle.addEventListener("click", () => {
        const currentTheme = els.html.getAttribute("data-theme");
        const nextTheme = currentTheme === "dark" ? "light" : "dark";
        try {
            localStorage.setItem(THEME_KEY, nextTheme);
        } catch (error) {
        }
        els.html.setAttribute("data-theme", nextTheme);
    });
}

els.showBtn.addEventListener("click", showAnswer);
els.nextBtn.addEventListener("click", () => move(1));
els.modeNormal.addEventListener("click", () => setDirection("normal"));
els.modeReverse.addEventListener("click", () => setDirection("reverse"));
els.studyCards.addEventListener("click", () => setStudyType("cards"));
els.studyTyping.addEventListener("click", () => setStudyType("typing"));
els.typedAnswer.addEventListener("input", checkTypedAnswer);
els.typedAnswer.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        answerVisible ? setMark("green") : showAnswer();
    }
});
els.resetMarks.addEventListener("click", resetMarks);
els.sectionToggle.addEventListener("click", toggleSectionMenu);

document.querySelectorAll("[data-mark]").forEach(button => {
    button.addEventListener("click", () => setMark(button.dataset.mark));
});

document.addEventListener("keydown", event => {
    const target = event.target;
    const isTyping = target instanceof HTMLInputElement;
    if (isTyping) return;

    if (event.key === " ") {
        event.preventDefault();
        showAnswer();
    } else if (event.key === "ArrowRight") {
        move(1);
    } else if (event.key === "1") {
        setMark("red");
    } else if (event.key === "2") {
        setMark("green");
    }
});

document.addEventListener("click", event => {
    if (!sectionMenuOpen) return;
    const picker = document.querySelector(".section-picker");
    if (picker && !picker.contains(event.target)) {
        closeSectionMenu();
    }
});

initTheme();
renderSections();
renderNavigation();
goTo(0);
</script>
</body>
